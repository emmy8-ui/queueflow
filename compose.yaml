services:
  api:
    build:
      context: ./api
    container_name: queueflow-api
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./worker
    container_name: queueflow-worker


  redis:
    image: redis:7-alpine
    container_name: queueflow-redis
    ports:
      - "6379:6379"

