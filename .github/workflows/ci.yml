name: QueueFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install worker dependencies
        run: pip install -r worker/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile api/main.py
          python -m py_compile worker/worker.py

      - name: Build API Docker image
        run: docker build -t queueflow-api:ci ./api

      - name: Build worker Docker image
        run: docker build -t queueflow-worker:ci ./worker

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint queueflow-chart

      - name: Render Helm templates
        run: helm template queueflow queueflow-chart > /tmp/queueflow-rendered.yaml
